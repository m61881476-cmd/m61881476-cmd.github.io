<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>دفتر — إرسال إشعار</title>
<style>
  :root{color-scheme:light dark;--bg:#f2f2f7;--card:#fff;--fg:#000;--muted:#6e6e73;--line:#d1d1d6;--accent:#007aff;--ok:#34c759;--err:#ff3b30}
  @media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--fg:#fff;--muted:#98989d;--line:#38383a;--accent:#0a84ff}}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,"SF Arabic","Segoe UI",Tahoma,sans-serif}
  main{max-width:560px;margin:0 auto;padding:24px 16px 48px}h1{font-size:28px;margin:8px 0 4px}p.sub{color:var(--muted);margin:0 0 20px}
  .card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:16px}.card h2{font-size:13px;color:var(--muted);font-weight:500;margin:0 0 10px}
  label{display:block;font-size:14px;margin:10px 0 4px}input,textarea,select{width:100%;font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  textarea{min-height:90px;resize:vertical}.row{display:flex;gap:10px}.row>*{flex:1}
  button{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;width:100%;margin-top:14px}
  button.sec{background:transparent;color:var(--accent);border:1px solid var(--line)}button:disabled{opacity:.5}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}.stats b{display:block;font-size:22px}.stats span{font-size:12px;color:var(--muted)}
  .preview{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:10px 12px}.preview img{width:38px;height:38px;border-radius:9px}
  .preview b{display:block;font-size:15px}.preview small{color:var(--muted);white-space:pre-wrap}
  #log{font-size:14px;color:var(--muted);white-space:pre-wrap;margin-top:10px}.ok{color:var(--ok)}.err{color:var(--err)}
</style>
</head>
<body>
<main>
  <h1>إرسال إشعار</h1>
  <p class="sub">لكل اللي فعّلوا الإشعارات في دفتر على أندرويد والآيفون.</p>

  <div class="card">
    <h2>السيرفر</h2>
    <label for="srv">رابط سيرفر الإشعارات</label>
    <input id="srv" dir="ltr" placeholder="https://daftar-push.NAME.workers.dev">
    <label for="tok">كلمة سر المسؤول (ADMIN_TOKEN)</label>
    <input id="tok" type="password" dir="ltr" autocomplete="current-password">
    <button class="sec" id="statsBtn" type="button">عرض عدد المشتركين</button>
    <div class="stats" id="stats" hidden></div>
  </div>

  <div class="card">
    <h2>الرسالة</h2>
    <label for="title">العنوان</label>
    <input id="title" maxlength="80" value="دفتر 1.3 نزل 🎉">
    <label for="body">النص</label>
    <textarea id="body" maxlength="400">افتح التطبيق عشان تاخد التحديث الجديد.</textarea>
    <div class="row">
      <div><label for="url">لما يدوس يفتح</label>
        <select id="url"><option value="./">الصفحة الرئيسية</option><option value="./#chat">المحادثة (قيد جديد)</option><option value="./#analytics">التحليلات</option><option value="./#statements">القوائم</option><option value="./#journal">الدفتر</option><option value="./#prefs">الإعدادات</option></select></div>
      <div><label for="plat">يتبعت لـ</label>
        <select id="plat"><option value="all">الكل</option><option value="android">أندرويد بس</option><option value="ios">آيفون بس</option><option value="desktop">الكمبيوتر بس</option></select></div>
    </div>
    <label>معاينة</label>
    <div class="preview"><img src="../icons/icon-192.png" alt=""><div><b id="pvT"></b><small id="pvB"></small></div></div>
    <button id="send" type="button">ابعت الإشعار</button>
    <div id="log" role="status"></div>
  </div>
</main>
<script>
const $ = s => document.querySelector(s);
const srv = $('#srv'), tok = $('#tok');
srv.value = localStorage.getItem('dp:srv') || '';
tok.value = sessionStorage.getItem('dp:tok') || '';
srv.oninput = () => localStorage.setItem('dp:srv', srv.value.trim());
tok.oninput = () => sessionStorage.setItem('dp:tok', tok.value);
const base = () => srv.value.trim().replace(/\/$/, '');
const pv = () => { $('#pvT').textContent = $('#title').value || 'دفتر'; $('#pvB').textContent = $('#body').value; };
$('#title').oninput = $('#body').oninput = pv; pv();
const log = (t, cls = '') => { const l = $('#log'); l.className = cls; l.textContent = t; };
async function api(path, body) {
  const r = await fetch(base() + path, { method: body ? 'POST' : 'GET', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + tok.value }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(r.status === 401 ? 'كلمة السر غلط' : j.error || ('خطأ ' + r.status));
  return j;
}
$('#statsBtn').onclick = async () => {
  try { const s = await api('/stats'); const el = $('#stats'); el.hidden = false;
    el.innerHTML = [['الكل', s.total], ['أندرويد', s.android], ['آيفون', s.ios], ['كمبيوتر', s.desktop]].map(([k, v]) => `<div><b>${v}</b><span>${k}</span></div>`).join(''); }
  catch (e) { log(e.message, 'err'); }
};
$('#send').onclick = async () => {
  if (!base() || !tok.value) { log('اكتب رابط السيرفر وكلمة السر الأول', 'err'); return; }
  if (!confirm('هيتبعت الإشعار ده لكل المشتركين. متأكد؟')) return;
  const btn = $('#send'); btn.disabled = true;
  const msg = { title: $('#title').value.trim(), body: $('#body').value.trim(), url: $('#url').value, platform: $('#plat').value, tag: 'news' };
  const tot = { sent: 0, failed: 0, removed: 0 };
  try {
    let cursor = null;
    do {
      const r = await api('/send', { ...msg, cursor });
      tot.sent += r.sent; tot.failed += r.failed; tot.removed += r.removed; cursor = r.cursor;
      log(`بيبعت… وصل لـ ${tot.sent}`);
    } while (cursor);
    log(`تم ✓ اتبعت لـ ${tot.sent} جهاز${tot.removed ? ` · اتشال ${tot.removed} اشتراك قديم` : ''}${tot.failed ? ` · فشل ${tot.failed}` : ''}`, 'ok');
  } catch (e) { log('حصلت مشكلة: ' + e.message + (tot.sent ? ` (اتبعت لـ ${tot.sent} قبل المشكلة)` : ''), 'err'); }
  btn.disabled = false;
};
</script>
</body>
</html>
